aid: duvoai
name: duvo.ai
description: >-
  Duvo (taskcrew Inc.) is an enterprise process-intelligence and automation
  platform that captures how work actually happens and turns it into shared
  process catalogues, role-specific training, improvement plans, transformation
  roadmaps, SAP migration fact bases, and governed automation across existing
  systems. Its Public API (api.duvo.ai, v2) lets developers register agent
  workers, start and inspect agent-backed runs, manage durable queue cases,
  respond to human approval gates, drive Clarity process capture and Duvo Pulse
  dashboards, and connect a hosted MCP server. Duvo ships an npm CLI
  (@duvoai/cli), official agent skills on GitHub, webhooks, and an
  agent-discovery surface. Duvo is a portfolio company of Index Ventures.
