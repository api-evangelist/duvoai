note: >-
  Duvo documents a webhook event surface but does not publish an AsyncAPI
  document. Captured here as a webhook catalog. Delivery is JSON over HTTP;
  consumers verify the Duvo HMAC signature header against the raw request body
  with the workspace webhook secret, reject missing signatures / stale
  timestamps / mismatched HMAC, and retry transient 5xx responses idempotently.
delivery:
  transport: https-post
  content_type: application/json
  signing:
    method: HMAC
    header: Duvo signature header
    secret: workspace webhook secret
    verify: Verify signature over the raw request body; reject stale timestamps and mismatched HMAC.
  retries: Retried for transient 5xx; consumers must be idempotent (retries can duplicate events).
